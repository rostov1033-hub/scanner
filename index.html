<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5f5f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Сканер коробок</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding:
        max(12px, env(safe-area-inset-top))
        12px
        max(20px, env(safe-area-inset-bottom));
      background: #f5f5f5;
      color: #202124;
    }

    .topbar {
  width: 100%;
  max-width: 420px;

  margin: 0 auto 8px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 8px;

  min-height: 34px;
}

    #netState {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background: #e8f5e9;
      color: #2e7d32;
      cursor: pointer;
      user-select: none;
    }

    #netState.offline {
      background: #fdecea;
      color: #c62828;
    }

    #netState.syncing {
      background: #e8f0fe;
      color: #1a73e8;
    }

    #netState.pending {
      background: #fff8e1;
      color: #9a6700;
    }

    /* ===== СКАНЕР ===== */

  /* ===== ВЫБОР СКАНЕРА ===== */

.scan-mode-switch {
  display: flex;
  align-items: center;

  gap: 4px;

  width: auto;
  margin: 0;
}

/*
  Важно:
  глобальные стили button ниже в файле
  не должны растягивать эти кнопки.
*/
.scan-mode-btn {
  display: flex !important;

  width: auto !important;
  max-width: none !important;

  min-width: 58px !important;
  min-height: 32px !important;

  margin: 0 !important;

  padding: 5px 9px !important;

  justify-content: center;
  align-items: center;

  border: none !important;
  border-radius: 8px !important;

  background: #dedede !important;
  color: #444 !important;

  font-size: 12px !important;
  line-height: 1 !important;
  font-weight: 600 !important;

  white-space: nowrap;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.scan-mode-btn.active {
  background: #1a73e8 !important;
  color: #fff !important;
}


/*
  Онлайн остаётся справа.
*/
#netState {
  flex: 0 0 auto;
}


/*
  По областям ТСД и камеры можно
  делать горизонтальный свайп.

  Вертикальная прокрутка страницы
  при этом остаётся рабочей.
*/
#tsd-wrap,
#reader-wrap {
  touch-action: pan-y;
}


/* ===== ТСД ===== */

#tsd-wrap {
  display: block;

  width: 100%;
  max-width: 420px;

  margin: 0 auto;

  padding: 5px;

  background: #fff;

  border: 2px solid #1a73e8;
  border-radius: 9px;

  box-shadow: 0 1px 4px rgba(0,0,0,.10);
}


#tsdInput {
  display: block;

  width: 100%;
  height: 34px;

  padding: 4px 8px;

  border: none;
  border-radius: 5px;

  background: #fafafa;

  color: #202124;

  text-align: center;

  font-size: 16px;
  font-weight: 600;

  outline: none;
}


#tsdInput:focus {
  background: #fff;

  box-shadow:
    inset 0 0 0 2px
    rgba(26,115,232,.18);
}


/*
  Хорошо видимый фокус при навигации
  кнопкой Tab на ТСД.
*/
#btnClose:focus,
#btnCancel:focus,
#btnAgain:focus,
#btnSupplies:focus {
  outline: 3px solid #1a73e8;
  outline-offset: 2px;
}


/* ===== КАМЕРА ===== */



/* ===== КАМЕРА ===== */

#reader-wrap {
  display: none;

  width: 100%;
  max-width: 420px;
  height: 150px;

  margin: 0 auto;

  border-radius: 10px;
  overflow: hidden;
  position: relative;

  background: #000;

  box-shadow: 0 1px 5px rgba(0,0,0,.15);
}

#reader {
  width: 100%;
  height: 150px;

  border: none !important;
}

#reader video {
  width: 100% !important;
  height: 150px !important;

  /*
    Камера должна занимать всё горизонтальное окно.
    Чёрных полей справа и слева быть не должно.
  */
  object-fit: cover !important;

  object-position: center center !important;

  background: #000;
}

/*
  Само окно остаётся широким и компактным.
*/
#reader-wrap,
#reader {
  aspect-ratio: auto !important;
}

/*
  Убираем стандартную рамку html5-qrcode.
*/
#reader #qr-shaded-region {
  border: none !important;
  box-shadow: none !important;
}

#reader #qr-shaded-region > div {
  display: none !important;
}


/*
  Красная линия сканирования.
*/
#reader-wrap::after {
  content: "";

  position: absolute;
  z-index: 20;

  top: 50%;
  left: 5%;
  right: 5%;

  height: 2px;

  transform: translateY(-50%);

  background: #ff2020;

  border-radius: 2px;

  box-shadow:
    0 0 4px rgba(255,32,32,.9),
    0 0 8px rgba(255,32,32,.5);

  pointer-events: none;
}


/* ===== СТАТУС ===== */

   

    .status {
      max-width: 420px;
      min-height: 20px;
      text-align: center;
      color: #2e7d32;
      font-weight: 600;
      margin: 10px auto;
      font-size: 14px;
      line-height: 1.35;
    }

    .hint {
      color: #2e7d32;
      font-weight: 600;
    }

    .warn {
      color: #c62828;
      font-weight: 600;
    }

    /* ===== КАРТОЧКА ===== */

    #card {
      max-width: 420px;
      margin: 12px auto;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 5px rgba(0,0,0,.12);
      display: none;
    }

    #card table {
      width: 100%;
      border-collapse: collapse;
    }

    #card td {
      padding: 7px 4px;
      border-bottom: 1px solid #eee;
      font-size: 15px;
      vertical-align: top;
    }

    #card td:first-child {
      color: #666;
      white-space: nowrap;
      padding-right: 12px;
    }

    #card tr:last-child td {
      border-bottom: none;
    }

    /* ===== ПЛАШКИ СТАТУСА ===== */

    .badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 92px;
      min-height: 27px;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.1;
      font-weight: 600;
      text-align: center;
    }

    .st-new {
      background: #fdecea;
      color: #c62828;
    }

    .st-work {
      background: #fff3cd;
      color: #946200;
    }

    .st-done {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .badge-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    /* ===== СЧЁТЧИК ===== */

    .counter {
      font-weight: 600;
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
      text-align: right;
      white-space: nowrap;
    }

    .counter-blue {
      color: #1a73e8;
    }

    .counter-yellow {
      color: #b07800;
    }

    .counter-green {
      color: #2e7d32;
    }

    /* ===== ПОСТАВКА В КАРТОЧКЕ ===== */

    #supplyList {
      margin-top: 12px;
      border-top: 2px solid #eee;
      padding-top: 10px;
    }

    #supplyList b {
      display: block;
      margin: 8px 0 4px;
      font-size: 14px;
    }

    #supplyList .badge {
      min-width: 82px;
      padding: 3px 7px;
      font-size: 12px;
    }

    /* ===== СПИСОК КОРОБОК В ПОСТАВКЕ ===== */

html,
body {
  overflow-x: hidden;
}

#card,
#allSupplies {
  overflow-x: hidden;
}

.box-list-table {
  width: 100%;
  max-width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.box-list-table td {
  padding: 10px 4px;
  vertical-align: middle;
  overflow-wrap: anywhere;
  word-break: break-word;
}

/*
  Левая колонка — номер этикетки и товар.
  Убираем white-space: nowrap, который раньше
  выталкивал статус за правый край.
*/
.box-list-table td:first-child {
  width: auto;
  white-space: normal !important;
  padding-right: 8px !important;
}

/*
  Для статуса всегда оставляем место
  внутри ширины экрана.
*/
.box-list-table td:last-child {
  width: 105px;
  text-align: center !important;
}

/*
  Разделитель между коробками.
*/
.box-list-table tr:not(:last-child) td {
  border-bottom: 1px solid #ddd;
}

/*
  Плашка может переносить текст,
  поэтому "В процессе" никогда
  не вылезет за экран.
*/
.box-list-table .badge {
  display: flex;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  min-height: 28px;
  justify-content: center;
  align-items: center;
  text-align: center;
  white-space: normal;
  line-height: 1.15;
  padding: 5px 5px;
}

    .box-code {
  display: inline-block;
  max-width: 100%;
  padding: 3px 0;
  font-weight: 700;
  color: #1a73e8;
  text-decoration: underline;
  cursor: pointer;
  overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
}

.box-barcode {
  width: 100%;
  padding: 10px 0 6px;
  background: #fff;
  overflow: hidden;
}

.barcode-row {
  display: none;
}

.barcode-row.open {
  display: table-row;
}

.barcode-row td {
  width: 100% !important;
  padding: 0 4px 12px !important;
  border-bottom: 1px solid #ddd !important;
}

.box-barcode svg {
  display: block;
  width: 100% !important;
  max-width: none !important;
  height: auto !important;

  /*
    Не даём браузеру размывать границы полос.
  */
  shape-rendering: crispEdges;
}

.box-barcode svg rect {
  shape-rendering: crispEdges;
}
    
    /* ===== ВСЕ ПОСТАВКИ ===== */

    #allSupplies {
      max-width: 420px;
      margin: 12px auto;

}

<body>


  <div class="topbar">

  <div
    class="scan-mode-switch"
    id="scanModeSwitch"
  >

    <button
  type="button"
  id="btnModeTsd"
  class="scan-mode-btn active"
  tabindex="-1"
>
  ТСД
</button>

    <button
  type="button"
  id="btnModeCamera"
  class="scan-mode-btn"
  tabindex="-1"
>
  Камера
</button>

  </div>

  <span id="netState">
    Онлайн
  </span>

</div>


<div id="tsd-wrap">

  <input
    id="tsdInput"
    type="text"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    tabindex="0"
  >

</div>


<div id="reader-wrap">
  <div id="reader"></div>
</div>

  <p class="status" id="status">Загрузка…</p>

  <div id="card"></div>

 
  <button
    id="btnClose"
    class="btn-close"
    style="display:none"
  >
    Закрыть коробку
  </button>

  <button
    id="btnCancel"

    Отмена

  <button
    id="btnAgain"
    class="btn-gray"
    style="display:none"
  >
    Сканировать другую коробку
  </button>

  <button
    id="btnSupplies"
    class="btn-gray"
    style="display:none"
  >
    Все поставки
  </button>

  <div id="allSupplies"></div>


  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <script>
    // =========================================================
    // API
    // =========================================================

    const API_URL =
      'https://script.google.com/macros/s/AKfycbwWvL9ZdXJCwQNnjFcOv5FmuG17Qipoo37XeHaLH14aUYaUSfNydCa8OyBn2BHklpMD/exec';


    // =========================================================
    // СТАТУСЫ
    // =========================================================

    const ST_NEW  = 'Не начата';
    const ST_WORK = 'В процессе';
    const ST_DONE = 'Закрыта';


    // =========================================================
    // LOCAL STORAGE
    // =========================================================

    const DB_CACHE_KEY = 'scanner_db_cache_v3';
    const QUEUE_KEY    = 'scanner_action_queue_v1';


    // =========================================================
    // DOM
    // =========================================================

    const el = id => document.getElementById(id);

    const statusEl = el('status');
    const cardEl   = el('card');
    const netState = el('netState');


    // =========================================================
    // СОСТОЯНИЕ
    // =========================================================

    let db = loadCachedDb();

   let currentCode = null;

/*
  box     — ждём коробку
  product — ждём товар для коробки
  pack    — товар проверен, коробку запаковывают
  confirm — ждём повторный скан коробки для закрытия
*/
let mode = 'box';


/*
  По умолчанию всегда ТСД.

  localStorage здесь специально НЕ используется:
  выбор сохраняется только пока открыта эта страница.

  После перезагрузки снова будет ТСД.
*/
let scanSource = 'tsd';


let cameraRunning = false;
let cameraStarting = false;

let lastCameraCode = '';
let lastCameraAt = 0;

let lastBoxCameraCode = '';
let lastBoxCameraAt = 0;

let syncBusy = false;


    // =========================================================
    // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // =========================================================

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }


    // =========================================================
    // КЭШ ТАБЛИЦЫ
    // =========================================================

    function loadCachedDb() {
      try {
        const raw = localStorage.getItem(DB_CACHE_KEY);

        if (!raw) return null;

        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    function saveDbCache() {
      try {
        localStorage.setItem(
          DB_CACHE_KEY,
          JSON.stringify(db || {})
        );
      } catch (e) {}
    }


    // =========================================================
    // ОЧЕРЕДЬ ДЕЙСТВИЙ
    // =========================================================

    function getQueue() {
      try {
        return JSON.parse(
          localStorage.getItem(QUEUE_KEY) || '[]'
        );
      } catch (e) {
        return [];
      }
    }

    function saveQueue(queue) {
      localStorage.setItem(
        QUEUE_KEY,
        JSON.stringify(queue)
      );

      updateNetState();
    }

    function addToQueue(action, code, newStatus) {
      const queue = getQueue();

      queue.push({
        id:
          Date.now().toString(36) +
          Math.random().toString(36).slice(2),

        action,
        code,
        newStatus,
        createdAt: Date.now()
      });

      saveQueue(queue);
    }


    /*
      Если мы загрузили свежую таблицу с сервера,
      но у нас есть ещё не отправленные локальные действия,
      накладываем их поверх серверной версии.

      Благодаря этому офлайн-изменения не исчезнут.
    */
    function applyPendingStatuses(targetDb) {
      const queue = getQueue();

      queue.forEach(item => {
        if (targetDb[item.code]) {
          targetDb[item.code].status = item.newStatus;
        }
      });

      return targetDb;
    }


    // =========================================================
    // ИНДИКАТОР СЕТИ
    // =========================================================

    function updateNetState() {
      const queue = getQueue();

      netState.className = '';

      if (!navigator.onLine) {
        netState.classList.add('offline');

        netState.textContent =
          queue.length
            ? 'Офлайн • ' + queue.length
            : 'Офлайн';

        return;
      }

      if (syncBusy) {
        netState.classList.add('syncing');
        netState.textContent = 'Синхронизация…';
        return;
      }

      if (queue.length) {
        netState.classList.add('pending');

        netState.textContent =
          'Ждут отправки • ' + queue.length;

        return;
      }

      netState.textContent = 'Онлайн';
    }


    // =========================================================
    // ПИН
    // =========================================================

    function getPin() {
      let pin = localStorage.getItem('scanner_pin');

      if (!pin) {
        pin = prompt('Введите ПИН доступа:') || '';

        if (pin) {
          localStorage.setItem(
            'scanner_pin',
            pin
          );
        }
      }

      return pin;
    }


    // =========================================================
    // API
    // =========================================================

    function api(params) {
      return fetch(
        API_URL +
        '?' +
        params +
        '&key=' +
        encodeURIComponent(getPin()),
        {
          cache: 'no-store'
        }
      )
        .then(r => {
          if (!r.ok) {
            throw new Error(
              'HTTP ' + r.status
            );
          }

          return r.json();
        })
        .then(res => {
          if (res.error === 'auth') {
            localStorage.removeItem(
              'scanner_pin'
            );

            alert('Неверный ПИН');

            location.reload();

            throw new Error('auth');
          }

          return res;
        });
    }


    // =========================================================
    // СИНХРОНИЗАЦИЯ ОЧЕРЕДИ
    // =========================================================

    async function processQueue() {
      if (syncBusy) return;

      if (!navigator.onLine) {
        updateNetState();
        return;
      }

      let queue = getQueue();

      if (!queue.length) {
        updateNetState();
        return;
      }

      syncBusy = true;
      updateNetState();

      while (
        queue.length &&
        navigator.onLine
      ) {
        const item = queue[0];

        try {
          const res = await api(
            'action=' +
            encodeURIComponent(item.action) +
            '&code=' +
            encodeURIComponent(item.code)
          );

          if (!res.ok) {
            /*
              Сервер ответил, но само действие
              не принял.

              Не удаляем действие из очереди,
              чтобы оно не потерялось.
            */
            break;
          }

          /*
            Действие успешно записано —
            удаляем его из очереди.
          */
          queue.shift();

          saveQueue(queue);

        } catch (e) {
          /*
            Нет сети / временная ошибка.

            Ничего не удаляем.
            Повторим позже.
          */
          break;
        }
      }

      syncBusy = false;
      updateNetState();
    }


    /*
      Нажатие на индикатор сети =
      ручная попытка синхронизации.
    */
    netState.onclick = () => {
      processQueue();
    };


    // =========================================================
    // ЗАГРУЗКА ТАБЛИЦЫ
    // =========================================================

    async function loadData() {

      /*
        Если есть локальная копия —
        сайт сразу можно использовать.
      */
      if (db) {
        statusEl.textContent =
          navigator.onLine
            ? 'Отсканируйте штрих-код коробки'
            : 'Офлайн-режим. Используются сохранённые данные';

/*
  Номер текущего запуска камеры.

  Нужен, чтобы старый незавершённый start()
  не мог включить камеру после переключения
  обратно на ТСД.
*/
let cameraGeneration = 0;


function createCameraScanner() {

  return new Html5Qrcode(
    'reader',
    {
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      },

      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.ITF
      ]
    }
  );
}


// =========================================================
// ЗВУК
// =========================================================

let audioContext = null;


function getAudioContext() {

  if (!audioContext) {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContextClass) {
      return null;
    }

    audioContext =
      new AudioContextClass();
  }


  if (
    audioContext.state ===
    'suspended'
  ) {

    audioContext
      .resume()
      .catch(() => {});
  }


  return audioContext;
}


function beep(
  frequency,
  duration,
  delay = 0,
  volume = 0.24,
  type = 'sine'
) {

  const ctx =
    getAudioContext();

  if (!ctx) {
    return;
  }


  const start =
    ctx.currentTime +
    delay / 1000;


  const oscillator =
    ctx.createOscillator();

  const gain =
    ctx.createGain();


  oscillator.type =
    type;


  oscillator.frequency
    .setValueAtTime(
      frequency,
      start
    );


  gain.gain
    .setValueAtTime(
      0.0001,
      start
    );


  gain.gain
    .exponentialRampToValueAtTime(
      volume,
      start + 0.008
    );


  gain.gain
    .setValueAtTime(
      volume,
      start +
      Math.max(
        0.01,
        duration / 1000 - 0.025
      )
    );


  gain.gain
    .exponentialRampToValueAtTime(
      0.0001,
      start + duration / 1000
    );


  oscillator.connect(
    gain
  );


  gain.connect(
    ctx.destination
  );


  oscillator.start(
    start
  );


  oscillator.stop(
    start +
    duration / 1000 +
    0.02
  );
}


/*
  УДАЧНЫЙ СКАН.

async function releaseCameraInstance(
  instance
) {

  if (!instance) {
    return;
  }


  try {
    await instance.stop();
  } catch (e) {}


  try {
    await instance.clear();
  } catch (e) {}
}


// =========================================================
// ЗАПУСК КАМЕРЫ
// =========================================================

async function startCamera() {

  if (
    scanSource !== 'camera' ||
    !scannerNeedsInput()
  ) {
    return;
  }


  if (
    cameraRunning ||
    cameraStarting
  ) {
    return;
  }


  const generation =
    ++cameraGeneration;


  cameraStarting =
    true;


  /*
    Сначала показываем контейнер.

    html5-qrcode должен запускаться
    внутри уже видимого блока.
  */
  el('reader-wrap').style.display =
    'block';


  /*
    Даём браузеру реально отрисовать
    контейнер перед scanner.start().
  */
  await new Promise(
    resolve =>
      requestAnimationFrame(
        () => resolve()
      )
  );


  const readerWidth =
    el('reader-wrap').clientWidth ||
    Math.min(
      420,
      window.innerWidth - 24
    );


  /*
    qrbox гарантированно не выходит
    за размеры окна камеры.
  */
  const qrWidth =
    Math.max(
      180,
      Math.min(
        300,
        readerWidth - 24
      )
    );


  /*
    Намеренно простой конфиг.

    Не задаём здесь aspectRatio,
    разрешение камеры и другие жёсткие
    ограничения — именно они ломают
    запуск на части телефонов.
  */
  const scannerConfig = {

    fps: 15,

    qrbox: {
      width: qrWidth,
      height: 90
    },

    disableFlip: true
  };


  let localScanner =
    createCameraScanner();


  scanner =
    localScanner;


  let started =
    false;


  // =====================================================
  // ПОПЫТКА №1 — обычная задняя камера
  // =====================================================

  try {

    await localScanner.start(

      {
        facingMode: 'environment'
      },

      scannerConfig,

      onCameraScan
    );


    started =
      true;


  } catch (firstError) {

    console.warn(
      'Первый запуск камеры не удался:',
      firstError
    );


    /*
      ВАЖНО:
      сломанный экземпляр больше
      повторно не используем.
    */
    await releaseCameraInstance(
      localScanner
    );


    /*
      Пользователь мог уже переключиться
      обратно на ТСД.
    */
    if (
      generation !== cameraGeneration ||
      scanSource !== 'camera'
    ) {

      cameraStarting =
        false;

      return;
    }


    // ===================================================
    // ПОПЫТКА №2 — выбираем физическую камеру
    // ===================================================

    try {

      const cameras =
        await Html5Qrcode.getCameras();


      if (
        !cameras ||
        !cameras.length
      ) {

        throw new Error(
          'Камеры не найдены'
        );
      }


      /*
        Ищем заднюю камеру по названию.
      */
      let selectedCamera =
        cameras.find(
          camera =>
            /back|rear|environment|зад/i.test(
              camera.label || ''
            )
        );


      /*
        Если браузер не дал названия камер,
        на телефонах задняя камера чаще всего
        находится последней в списке.
      */
      if (!selectedCamera) {

        selectedCamera =
          cameras[
            cameras.length - 1
          ];
      }


      /*
        Создаём НОВЫЙ Html5Qrcode,
        а не используем экземпляр,
        на котором первый start() упал.
      */
      localScanner =
        createCameraScanner();


      scanner =
        localScanner;


      await localScanner.start(

        selectedCamera.id,

        scannerConfig,

        onCameraScan
      );


      started =
        true;


    } catch (secondError) {

      console.error(
        'Не удалось открыть камеру:',
        firstError,
        secondError
      );


      await releaseCameraInstance(
        localScanner
      );
    }
  }


  /*
    Пока камера открывалась,
    пользователь мог свайпнуть обратно на ТСД.
  */
  if (
    generation !== cameraGeneration ||
    scanSource !== 'camera' ||
    !scannerNeedsInput()
  ) {

    await releaseCameraInstance(
      localScanner
    );


    if (
      scanner === localScanner
    ) {
      scanner = null;
    }


    cameraRunning =
      false;

    cameraStarting =
      false;


    return;
  }


  if (!started) {

    scanner =
      null;

    cameraRunning =
      false;

    cameraStarting =
      false;


    statusEl.innerHTML =
      '<span class="warn">' +
      'Не удалось открыть камеру' +
      '</span>' +

      '<br>' +

      '<small>' +
      'Проверьте разрешение камеры в браузере' +
      '</small>';


    return;
  }


  cameraRunning =
    true;

  cameraStarting =
    false;


  // =====================================================
  // ДОПОЛНИТЕЛЬНАЯ НАСТРОЙКА КАМЕРЫ
  // =====================================================

  try {

    const caps =
      localScanner
        .getRunningTrackCapabilities();


    /*
      Сбрасываем аппаратный зум
      на минимальное значение.
  */
    if (
      caps &&
      caps.zoom &&
      typeof caps.zoom.min === 'number'
    ) {

      localScanner
        .applyVideoConstraints({
          advanced: [
            {
              zoom: caps.zoom.min
            }
          ]
        })
        .catch(() => {});
    }


    /*
      Если телефон поддерживает
      постоянный автофокус — включаем.
    */
    if (
      caps &&
      Array.isArray(
        caps.focusMode
      ) &&
      caps.focusMode.includes(
        'continuous'
      )
    ) {

      localScanner
        .applyVideoConstraints({
          advanced: [
            {
              focusMode: 'continuous'
            }
          ]
        })
        .catch(() => {});
    }

  } catch (e) {}
}


// =========================================================
// ОСТАНОВКА КАМЕРЫ
// =========================================================

async function stopCamera() {

  /*
    Делает любой выполняющийся startCamera()
    устаревшим.
  */
  cameraGeneration++;


  const localScanner =
    scanner;


  scanner =
    null;


  cameraRunning =
    false;

  cameraStarting =
    false;


  if (!localScanner) {
    return;
  }


  await releaseCameraInstance(
    localScanner
  );
}

let swipeStartX = 0;
let swipeStartY = 0;


/*
  Свайп работает непосредственно
  по текущему полю сканирования.

  Влево  → Камера
  Вправо → ТСД
*/
function addScanSwipe(
  element
) {

  element.addEventListener(
    'touchstart',
    event => {

      if (
        !event.touches ||
        event.touches.length !== 1
      ) {
        return;
      }


      swipeStartX =
        event.touches[0].clientX;

      swipeStartY =
        event.touches[0].clientY;

    },
    {
      passive: true
    }
  );


  element.addEventListener(
    'touchend',
    event => {

      if (
        !event.changedTouches ||
        event.changedTouches.length !== 1
      ) {
        return;
      }


      const endX =
        event.changedTouches[0].clientX;

      const endY =
        event.changedTouches[0].clientY;


      const dx =
        endX - swipeStartX;

      const dy =
        endY - swipeStartY;


      /*
        Короткое движение считаем обычным
        нажатием, а не свайпом.
      */
      if (
        Math.abs(dx) < 55
      ) {
        return;
      }


      /*
        Вертикальная прокрутка страницы
        не должна переключать сканер.
      */
      if (
        Math.abs(dx) <
        Math.abs(dy) * 1.2
      ) {
        return;
      }


      getAudioContext();


      /*
        Свайп ВЛЕВО.
      */
      if (
        dx < 0
      ) {

        setScanSource(
          'camera'
        );

        return;
      }


      /*
        Свайп ВПРАВО.
      */
      setScanSource(
        'tsd'
      );
    },
    {
      passive: true
    }
  );
}


addScanSwipe(
  el('tsd-wrap')
);


addScanSwipe(
  el('reader-wrap')
);

tsdInput.addEventListener(
  'keydown',
  event => {

    /*
      Tab здесь НЕ обрабатываем.

      Общий обработчик навигации,
      который будет ниже,
      сам перенесёт фокус на следующую
      видимую рабочую кнопку.
    */
    if (
      event.key === 'Tab'
    ) {
      return;
    }


    /*
      Штрихкод ТСД заканчивается Enter.
    */
    if (
      event.key !== 'Enter'
    ) {
      return;
    }


    event.preventDefault();


    getAudioContext();


    const value =
      tsdInput.value.trim();


    if (!value) {

      focusTsd();

      return;
    }


    /*
      Сразу очищаем поле для
      следующего сканирования.
    */
    tsdInput.value =
      '';


    processScannedCode(
      value,
      'tsd'
    );


    /*
      Если следующий этап тоже требует
      сканирования — возвращаем курсор.

      Если началась упаковка,
      scannerNeedsInput() вернёт false
      и поле будет скрыто.
    */
    if (
      scanSource === 'tsd' &&
      scannerNeedsInput()
    ) {

      focusTsd();
    }
  }
);

// TAB-НАВИГАЦИЯ ДЛЯ ТСД

document.addEventListener(
  'keydown',
  event => {

    if (
      event.key !== 'Tab'
    ) {
      return;
    }


    /*
      Эта специальная навигация нужна
      только в режиме ТСД.
    */
    if (
      scanSource !== 'tsd'
    ) {
      return;
    }


    const targets = [];


    /*
      Поле сканирования добавляется
      в навигацию только если оно сейчас
      действительно показано.
    */
    if (
      scannerNeedsInput() &&
      el('tsd-wrap').offsetParent !== null
    ) {

      targets.push(
        tsdInput
      );
    }


    /*
      Затем идут ВСЕ рабочие кнопки,
      которые сейчас видны.
    */
    targets.push(
      ...getVisibleActionButtons()
    );


    if (!targets.length) {
      return;
    }


    const currentIndex =
      targets.indexOf(
        document.activeElement
      );


    /*
      Если фокус находится вне нашего
      рабочего интерфейса — стандартный
      Tab не перехватываем.
    */
    if (
      currentIndex === -1
    ) {
      return;
    }


    event.preventDefault();


    const direction =
      event.shiftKey
        ? -1
        : 1;


    let nextIndex =
      currentIndex +
      direction;


    if (
      nextIndex >= targets.length
    ) {
      nextIndex = 0;
    }


    if (
      nextIndex < 0
    ) {
      nextIndex =
        targets.length - 1;
    }


    targets[
      nextIndex
    ].focus();
  }
);

function onCameraScan(text) {

  const code =
    normalizeScan(text);


  if (!code) {
    return;
  }


  const now =
    Date.now();


  /*
    html5-qrcode может вернуть один и тот же
    штрихкод несколько раз подряд.

    Не считаем это несколькими сканами.
  */
  if (
    code === lastCameraCode &&
    now - lastCameraAt < 700
  ) {
    return;
  }


  lastCameraCode =
    code;

  lastCameraAt =
    now;


  processScannedCode(
    code,
    'camera'
  );
}

    function supplyStats(supply) {

      let total = 0;
      let done = 0;
      let work = 0;

      for (const code in db) {

        const box = db[code];

        if (box.supply !== supply) {
          continue;
        }

        total++;

        if (box.status === ST_DONE) {
          done++;
        }

        if (box.status === ST_WORK) {
          work++;
        }
      }

      /*
        В общий счётчик включаем:

        Закрыта
        +
        В процессе
      */
      const counted =
        done + work;

      return {
        total,
        done,
        work,
        counted
      };
    }


    function getCounterClass(stats) {

      /*
        Есть хотя бы одна "В процессе" —
        счётчик жёлтый.
      */
      if (stats.work > 0) {
        return 'counter-yellow';
      }

      /*
        Всё полностью закрыто —
        зелёный.
      */
      if (
        stats.total > 0 &&
        stats.done === stats.total
      ) {
        return 'counter-green';
      }

      return 'counter-blue';
    }

    */
    const barcodeRow =

    if (

      !barcodeRow.classList.contains(
        'barcode-row'
      )
    ) {
      return;
    }

      Повторное нажатие —
      закрываем штрихкод.
    */
    if (
      barcodeRow.classList.contains('open')
    ) {
      barcodeRow.classList.remove('open');
      return;
    }


    /*
      Закрываем ранее открытый штрихкод.
    */
    document
      .querySelectorAll('.barcode-row.open')
      .forEach(row => {
        row.classList.remove('open');
      });


    barcodeRow.classList.add('open');


    /*
      Если уже рисовали его раньше,
      второй раз не генерируем.
    */
    if (
      barcodeRow.dataset.rendered === '1'
    ) {
      return;

    const svg =
      barcodeRow.querySelector('svg');

    const code =
      barcodeRow.dataset.barcode;


    try {

      JsBarcode(
        svg,
        code,
        {
          format: 'CODE128',

          /*
            Целое значение вместо 1.7:

          width: 2,

function setStatusSilent(
  action,
  newStatus
) {

  const code =
    currentCode;


  if (
    !db ||
    !db[code]
  ) {
    return;
  }


  /*
    Интерфейс меняется мгновенно.
  */
  db[code].status =
    newStatus;


  saveDbCache();


  /*
    Серверная запись попадает
    в локальную очередь.
  */
  addToQueue(
    action,
    code,
    newStatus
  );


  /*
    Отправляем в фоне.
    Пользователь этого не ждёт.
  */
  processQueue();
}

        }


        if (
          b.cluster &&
          !st.clusters.includes(
            b.cluster
          )
        ) {

          st.clusters.push(
            b.cluster
          );
        }
      }


      let html =
        '<b>Все поставки</b>';


      /*
        СОРТИРОВКА ПО АЛФАВИТУ
      */
      /*
  Сначала сами названия кластеров
  сортируем А → Я.
*/
for (const supplyName in stats) {
  stats[supplyName].clusters.sort(
    (a, b) =>
      a.localeCompare(
        b,
        'ru',
        {
          numeric: true,
          sensitivity: 'base'
        }
      )
  );
}


/*
  Все поставки сортируем уже
  НЕ по названию поставки,
  а по названию кластера А → Я.

  Если у поставки несколько кластеров,
  для сортировки берётся первый
  по алфавиту.

  Поставки без кластера идут в конце.
*/
const supplyNames =
  Object.keys(stats)
    .sort((a, b) => {

      const clusterA =
        stats[a].clusters[0] || '';

      const clusterB =
        stats[b].clusters[0] || '';


      if (!clusterA && clusterB) {
        return 1;
      }

      if (clusterA && !clusterB) {
        return -1;
      }


      const clusterCompare =
        clusterA.localeCompare(
          clusterB,
          'ru',
          {
            numeric: true,
            sensitivity: 'base'
          }
        );


      /*
        Если кластер одинаковый —
        внутри него поставки сортируем
        по названию.
      */
      if (clusterCompare !== 0) {
        return clusterCompare;
      }


      return a.localeCompare(
        b,
        'ru',
        {
          numeric: true,
          sensitivity: 'base'
        }
      );
    });


      for (
        const supplyName
        of supplyNames
      ) {

        const st =
          stats[supplyName];


        /*
          В счётчик включаем:
          Закрыта + В процессе
        */
        const counted =
          st.done + st.work;


        let statusClass;


        /*
          Есть "В процессе" —
          жёлтый счётчик.
        */
        if (st.work > 0) {

          statusClass =
            'sup-yellow';


        /*
          Все полностью закрыты —
          зелёный.
        */
        } else if (
          st.done === st.total
        ) {

          statusClass =
            'sup-green';


        /*
          Иначе красный.
        */
        } else {

          statusClass =
            'sup-red';
        }


        html +=
          '<div ' +
          'class="sup-row" ' +
          'data-supply="' +
          escapeHtml(supplyName) +
          '">' +

            '«' +
            escapeHtml(supplyName) +
            '» — ' +

            '<span class="' +
            statusClass +
            '">' +

              'Закрыто ' +
              counted +
              '/' +
              st.total +

            '</span>' +


            (
              st.clusters.length
                ?
                  '<br>' +
                  '<small style="color:#666">' +
                  escapeHtml(
                    st.clusters.join(', ')
                  ) +
                  '</small>'
                :
                  ''
            ) +

          '</div>' +

          '<div ' +
          'class="sup-detail" ' +
          'style="display:none">' +
          '</div>';
      }


      panel.innerHTML = html;


      panel
        .querySelectorAll(
          '.sup-row'
        )
        .forEach(row => {

          row.onclick = () => {

            const det =
              row.nextElementSibling;


            if (
              det.style.display ===
              'block'
            ) {

              det.style.display =
                'none';

              return;
            }


            det.innerHTML =
              supplyBoxesHtml(
                row.dataset.supply
              );


            det.style.display =
              'block';
          };
        });


      panel.style.display =
        'block';
    };


    // =========================================================
    // СОБЫТИЯ СЕТИ
    // =========================================================

    window.addEventListener(
      'offline',
      () => {

        updateNetState();

        if (!currentCode) {
          statusEl.textContent =
            'Офлайн-режим. Изменения будут сохранены и отправлены позже';
        }
      }
    );


    window.addEventListener(
      'online',
      async () => {

        updateNetState();

        /*
          Сначала отправляем все
          накопившиеся действия.
        */
        await processQueue();


        /*
          Потом тихо пытаемся получить
          свежую таблицу.
        */
        try {

          const res =
            await api('all=1');


          db =
            applyPendingStatuses(
              res.all || {}
            );


          saveDbCache();


          if (
            currentCode &&
            db[currentCode]
          ) {
            render();
          }

        } catch (e) {}


        updateNetState();
      }
    );


    updateNetState();


    // =========================================================
    // PWA / SERVICE WORKER
    // =========================================================

    if (
      'serviceWorker' in navigator
    ) {

      window.addEventListener(
        'load',
        () => {

          navigator
            .serviceWorker
            .register('./sw.js')
            .catch(() => {});
        }
      );
    }

  </script>

</body>
</html>
