<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5f5f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Сканер коробок</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding:
        max(12px, env(safe-area-inset-top))
        12px
        max(20px, env(safe-area-inset-bottom));
      background: #f5f5f5;
      color: #202124;
    }

    .topbar {
      max-width: 420px;
      margin: 0 auto 10px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      min-height: 24px;
    }

    #netState {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background: #e8f5e9;
      color: #2e7d32;
      cursor: pointer;
      user-select: none;
    }

    #netState.offline {
      background: #fdecea;
      color: #c62828;
    }

    #netState.syncing {
      background: #e8f0fe;
      color: #1a73e8;
    }

    #netState.pending {
      background: #fff8e1;
      color: #9a6700;
    }

    /* ===== СКАНЕР ===== */

  /* ===== ВЫБОР СКАНЕРА ===== */

.scan-mode-switch {
  display: flex;
  gap: 6px;
  width: 100%;
  max-width: 420px;
  margin: 0 auto 8px;
}

.scan-mode-btn {
  flex: 1;
  display: flex !important;
  width: auto !important;
  max-width: none !important;
  min-height: 38px !important;
  margin: 0 !important;
  padding: 8px 12px !important;

  justify-content: center;
  align-items: center;

  border-radius: 9px !important;
  background: #dedede !important;
  color: #444 !important;

  font-size: 14px !important;
  font-weight: 600;
}

.scan-mode-btn.active {
  background: #1a73e8 !important;
  color: #fff !important;
}


/* ===== ТСД ===== */

#tsd-wrap {
  width: 100%;
  max-width: 420px;
  min-height: 62px;

  margin: 0 auto;

  padding: 8px 10px;

  background: #fff;

  border: 2px solid #1a73e8;
  border-radius: 10px;

  box-shadow: 0 1px 4px rgba(0,0,0,.10);
}

#tsdHint {
  display: block;

  margin-bottom: 5px;

  text-align: center;

  color: #666;

  font-size: 12px;
  font-weight: 600;
}

#tsdInput {
  display: block;

  width: 100%;
  height: 34px;

  padding: 4px 8px;

  border: 1px solid #ddd;
  border-radius: 6px;

  background: #fafafa;

  color: #202124;

  text-align: center;

  font-size: 16px;
  font-weight: 600;

  outline: none;
}

#tsdInput:focus {
  border-color: #1a73e8;
  background: #fff;
}

#tsdInput:disabled {
  background: #eee;
  color: #888;
}



/* ===== КАМЕРА ===== */

#reader-wrap {
  display: none;

  width: 100%;
  max-width: 420px;
  height: 150px;

  margin: 0 auto;

  border-radius: 10px;
  overflow: hidden;
  position: relative;

  background: #000;

  box-shadow: 0 1px 5px rgba(0,0,0,.15);
}

#reader {
  width: 100%;
  height: 150px;

  border: none !important;
}

#reader video {
  width: 100% !important;
  height: 150px !important;

  /*
    contain не обрезает изображение камеры,
    поэтому на телефонах не создаётся
    дополнительный визуальный зум.
  */
  object-fit: contain !important;

  background: #000;
}


/*
  Убираем стандартную рамку html5-qrcode.
*/
#reader #qr-shaded-region {
  border: none !important;
  box-shadow: none !important;
}

#reader #qr-shaded-region > div {
  display: none !important;
}


/*
  Красная линия сканирования.
*/
#reader-wrap::after {
  content: "";

  position: absolute;
  z-index: 20;

  top: 50%;
  left: 5%;
  right: 5%;

  height: 2px;

  transform: translateY(-50%);

  background: #ff2020;

  border-radius: 2px;

  box-shadow:
    0 0 4px rgba(255,32,32,.9),
    0 0 8px rgba(255,32,32,.5);

  pointer-events: none;
}


/* ===== СТАТУС ===== */

    /* ===== КАРТОЧКА ===== */

    #card {
      max-width: 420px;
      margin: 12px auto;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 5px rgba(0,0,0,.12);

    #card table {

    #card td {

      border-bottom: 1px solid #eee;

    #card td:first-child {
      color: #666;
      white-space: nowrap;
      padding-right: 12px;
    }

    #card tr:last-child td {
      border-bottom: none;
    }

    /* ===== ПЛАШКИ СТАТУСА ===== */

    .badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 92px;
      min-height: 27px;
      padding: 4px 10px;
      border-radius: 14px;

      line-height: 1.1;

    /* ===== СЧЁТЧИК ===== */

    .counter {

      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
      text-align: right;
      white-space: nowrap;
    }

    .counter-blue {
      color: #1a73e8;
    }

    .counter-yellow {
      color: #b07800;
    }

    .counter-green {
      color: #2e7d32;
    }

    /* ===== ПОСТАВКА В КАРТОЧКЕ ===== */

    #supplyList {
      margin-top: 12px;
      border-top: 2px solid #eee;
      padding-top: 10px;
    }

    #supplyList b {
      display: block;
      margin: 8px 0 4px;
      font-size: 14px;
    }

    #supplyList .badge {
      min-width: 82px;
      padding: 3px 7px;
      font-size: 12px;
    }

    /* ===== СПИСОК КОРОБОК В ПОСТАВКЕ ===== */

html,
body {
  overflow-x: hidden;
}

#card,
#allSupplies {
  overflow-x: hidden;
}

.box-list-table {
  width: 100%;
  max-width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.box-list-table td {
  padding: 10px 4px;
  vertical-align: middle;
  overflow-wrap: anywhere;
  word-break: break-word;
}

/*
  Левая колонка — номер этикетки и товар.
  Убираем white-space: nowrap, который раньше
  выталкивал статус за правый край.
*/
.box-list-table td:first-child {
  width: auto;
  white-space: normal !important;
  padding-right: 8px !important;
}

/*
  Для статуса всегда оставляем место
  внутри ширины экрана.
*/
.box-list-table td:last-child {
  width: 105px;
  text-align: center !important;
}

/*
  Разделитель между коробками.
*/
.box-list-table tr:not(:last-child) td {
  border-bottom: 1px solid #ddd;
}

/*
  Плашка может переносить текст,
  поэтому "В процессе" никогда
  не вылезет за экран.
*/
.box-list-table .badge {
  display: flex;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  min-height: 28px;
  justify-content: center;
  align-items: center;
  text-align: center;
  white-space: normal;
  line-height: 1.15;
  padding: 5px 5px;
}

    .box-code {
  display: inline-block;
  max-width: 100%;
  padding: 3px 0;
  font-weight: 700;
  color: #1a73e8;
  text-decoration: underline;
  cursor: pointer;
  overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
}

.box-barcode {
  width: 100%;
  padding: 10px 0 6px;
  background: #fff;
  overflow: hidden;
}

.barcode-row {
  display: none;
}

.barcode-row.open {
  display: table-row;
}

.barcode-row td {
  width: 100% !important;
  padding: 0 4px 12px !important;
  border-bottom: 1px solid #ddd !important;
}

.box-barcode svg {
  display: block;
  width: 100% !important;
  max-width: none !important;
  height: auto !important;

  /*
    Не даём браузеру размывать границы полос.
  */

}

.box-barcode svg rect {
  shape-rendering: crispEdges;
}

  </button>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <script>
    // =========================================================
    // API
    // =========================================================

    const API_URL =
      'https://script.google.com/macros/s/AKfycbwWvL9ZdXJCwQNnjFcOv5FmuG17Qipoo37XeHaLH14aUYaUSfNydCa8OyBn2BHklpMD/exec';


    // =========================================================
    // СТАТУСЫ
    // =========================================================

    const ST_NEW  = 'Не начата';
    const ST_WORK = 'В процессе';
    const ST_DONE = 'Закрыта';


    // =========================================================
    // LOCAL STORAGE
    // =========================================================

    const DB_CACHE_KEY = 'scanner_db_cache_v3';
    const QUEUE_KEY    = 'scanner_action_queue_v1';


    // =========================================================
    // DOM
    // =========================================================

    const el = id => document.getElementById(id);

    const statusEl = el('status');
    const cardEl   = el('card');
    const netState = el('netState');


    // =========================================================
    // СОСТОЯНИЕ
    // =========================================================

    let db = loadCachedDb();

   let currentCode = null;

/*
  box     — ждём коробку
  product — ждём товар для коробки
  pack    — товар проверен, коробку запаковывают
  confirm — ждём повторный скан коробки для закрытия
*/
let mode = 'box';


/*
  По умолчанию всегда ТСД.

  localStorage здесь специально НЕ используется:
  выбор сохраняется только пока открыта эта страница.

  После перезагрузки снова будет ТСД.
*/
let scanSource = 'tsd';


let cameraRunning = false;
let cameraStarting = false;

let lastCameraCode = '';
let lastCameraAt = 0;

let lastBoxCameraCode = '';
let lastBoxCameraAt = 0;

let syncBusy = false;


    // =========================================================
    // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // =========================================================

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }


    // =========================================================
    // КЭШ ТАБЛИЦЫ
    // =========================================================

    function loadCachedDb() {
      try {
        const raw = localStorage.getItem(DB_CACHE_KEY);

        if (!raw) return null;

        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    function saveDbCache() {
      try {
        localStorage.setItem(
          DB_CACHE_KEY,
          JSON.stringify(db || {})
        );
      } catch (e) {}
    }


    // =========================================================
    // ОЧЕРЕДЬ ДЕЙСТВИЙ
    // =========================================================

    function getQueue() {
      try {
        return JSON.parse(
          localStorage.getItem(QUEUE_KEY) || '[]'
        );
      } catch (e) {
        return [];
      }
    }

    function saveQueue(queue) {
      localStorage.setItem(
        QUEUE_KEY,
        JSON.stringify(queue)
      );

      updateNetState();
    }

    function addToQueue(action, code, newStatus) {
      const queue = getQueue();

      queue.push({
        id:
          Date.now().toString(36) +
          Math.random().toString(36).slice(2),

        action,
        code,
        newStatus,
        createdAt: Date.now()
      });

      saveQueue(queue);
    }


    /*
      Если мы загрузили свежую таблицу с сервера,
      но у нас есть ещё не отправленные локальные действия,
      накладываем их поверх серверной версии.

      Благодаря этому офлайн-изменения не исчезнут.
    */
    function applyPendingStatuses(targetDb) {
      const queue = getQueue();

      queue.forEach(item => {
        if (targetDb[item.code]) {
          targetDb[item.code].status = item.newStatus;
        }
      });

      return targetDb;
    }


    // =========================================================
    // ИНДИКАТОР СЕТИ
    // =========================================================

    function updateNetState() {
      const queue = getQueue();

      netState.className = '';

      if (!navigator.onLine) {
        netState.classList.add('offline');

        netState.textContent =
          queue.length
            ? 'Офлайн • ' + queue.length
            : 'Офлайн';

        return;
      }

      if (syncBusy) {
        netState.classList.add('syncing');
        netState.textContent = 'Синхронизация…';
        return;
      }

      if (queue.length) {
        netState.classList.add('pending');

        netState.textContent =
          'Ждут отправки • ' + queue.length;

        return;
      }

      netState.textContent = 'Онлайн';
    }


    // =========================================================
    // ПИН
    // =========================================================

    function getPin() {
      let pin = localStorage.getItem('scanner_pin');

      if (!pin) {
        pin = prompt('Введите ПИН доступа:') || '';

        if (pin) {
          localStorage.setItem(
            'scanner_pin',
            pin
          );
        }
      }

      return pin;
    }


    // =========================================================
    // API
    // =========================================================

    function api(params) {
      return fetch(
        API_URL +
        '?' +
        params +
        '&key=' +
        encodeURIComponent(getPin()),
        {
          cache: 'no-store'
        }
      )
        .then(r => {
          if (!r.ok) {
            throw new Error(
              'HTTP ' + r.status
            );
          }

          return r.json();
        })
        .then(res => {
          if (res.error === 'auth') {
            localStorage.removeItem(
              'scanner_pin'
            );

            alert('Неверный ПИН');

            location.reload();

            throw new Error('auth');
          }

          return res;
        });
    }


    // =========================================================
    // СИНХРОНИЗАЦИЯ ОЧЕРЕДИ
    // =========================================================

    async function processQueue() {
      if (syncBusy) return;

      if (!navigator.onLine) {
        updateNetState();
        return;
      }

      let queue = getQueue();

      if (!queue.length) {
        updateNetState();
        return;
      }

      syncBusy = true;
      updateNetState();

      while (
        queue.length &&
        navigator.onLine
      ) {
        const item = queue[0];

        try {
          const res = await api(
            'action=' +
            encodeURIComponent(item.action) +
            '&code=' +
            encodeURIComponent(item.code)
          );

          if (!res.ok) {
            /*
              Сервер ответил, но само действие
              не принял.

              Не удаляем действие из очереди,
              чтобы оно не потерялось.
            */
            break;
          }

          /*
            Действие успешно записано —
            удаляем его из очереди.
          */
          queue.shift();

          saveQueue(queue);

        } catch (e) {
          /*
            Нет сети / временная ошибка.

            Ничего не удаляем.
            Повторим позже.
          */
          break;
        }
      }

      syncBusy = false;
      updateNetState();
    }


    /*
      Нажатие на индикатор сети =
      ручная попытка синхронизации.
    */
    netState.onclick = () => {
      processQueue();
    };


    // =========================================================
    // ЗАГРУЗКА ТАБЛИЦЫ
    // =========================================================

    async function loadData() {

      /*
        Если есть локальная копия —
        сайт сразу можно использовать.
      */
      if (db) {
        statusEl.textContent =
          navigator.onLine
            ? 'Отсканируйте штрих-код коробки'
            : 'Офлайн-режим. Используются сохранённые данные';

        el('btnSupplies').style.display =
          'block';
      }

      if (!navigator.onLine) {
        if (!db) {
          statusEl.innerHTML =
            '<span class="warn">' +
            'Нет интернета и нет сохранённых данных' +
            '</span>';
        }

        return;
      }

      try {
        const res = await api('all=1');

        db = applyPendingStatuses(
          res.all || {}
        );

        saveDbCache();

        statusEl.textContent =
          'Отсканируйте штрих-код коробки';

        el('btnSupplies').style.display =
          'block';
        updateScanSurface();

focusTsd();

        /*
          После получения базы пробуем
          отправить накопившиеся действия.
        */
        processQueue();

      } catch (e) {

        if (db) {
          statusEl.textContent =
            'Нет связи с сервером. Используются сохранённые данные';

          el('btnSupplies').style.display =
            'block';

        } else {
          statusEl.innerHTML =
            '<span class="warn">' +
            'Ошибка загрузки таблицы' +
            '</span>';
        }
      }
    }

    loadData();

// СКАНЕР: ТСД + КАМЕРА
// =========================================================

const tsdInput =
  el('tsdInput');

const tsdHint =
  el('tsdHint');

const btnModeTsd =
  el('btnModeTsd');

const btnModeCamera =
  el('btnModeCamera');


const scanner =
  new Html5Qrcode(
    'reader',
    {
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      },

      formatsToSupport: [
  Html5QrcodeSupportedFormats.CODE_128,
  Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.EAN_8,
  Html5QrcodeSupportedFormats.CODE_39,
  Html5QrcodeSupportedFormats.ITF
]
    }
  );


// =========================================================
// ЗВУК
// =========================================================

let audioContext = null;


function getAudioContext() {

  if (!audioContext) {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContextClass) {
      return null;
    }

    audioContext =
      new AudioContextClass();
  }


  if (
    audioContext.state ===
    'suspended'
  ) {

    audioContext
      .resume()
      .catch(() => {});
  }


  return audioContext;
}


function beep(
  frequency,
  duration,
  delay = 0,
  volume = 0.12
) {

  const ctx =
    getAudioContext();

  if (!ctx) {
    return;
  }


  const start =
    ctx.currentTime +
    delay / 1000;


  const oscillator =
    ctx.createOscillator();

  const gain =
    ctx.createGain();


  oscillator.type =
    'sine';

  oscillator.frequency
    .setValueAtTime(
      frequency,
      start
    );


  gain.gain
    .setValueAtTime(
      0.0001,
      start
    );

  gain.gain
    .exponentialRampToValueAtTime(
      volume,
      start + 0.01
    );

  gain.gain
    .exponentialRampToValueAtTime(
      0.0001,
      start + duration / 1000
    );


  oscillator.connect(gain);

  gain.connect(
    ctx.destination
  );


  oscillator.start(start);

  oscillator.stop(
    start +
    duration / 1000 +
    0.02
  );
}


function playSuccess() {

  beep(
    1050,
    70,
    0,
    0.12
  );

  beep(
    1500,
    90,
    90,
    0.12
  );
}


function playError() {

  beep(
    230,
    150,
    0,
    0.16
  );

  beep(
    180,
    190,
    180,
    0.16
  );
}


// =========================================================
// ОБЩИЕ ФУНКЦИИ СКАНИРОВАНИЯ
// =========================================================

function normalizeScan(value) {

  return String(
    value ?? ''
  )
    .trim()
    .replace(/\s+/g, '');
}


function scannerNeedsInput() {

  if (
    mode === 'box' &&
    !currentCode
  ) {
    return true;
  }


  if (
    mode === 'product'
  ) {
    return true;
  }


  if (
    mode === 'confirm'
  ) {
    return true;
  }


  return false;
}


function getScanPrompt() {

  if (
    mode === 'box' &&
    !currentCode
  ) {
    return 'Сканируйте коробку';
  }


  if (
    mode === 'product'
  ) {
    return 'Сканируйте товар';
  }


  if (
    mode === 'confirm'
  ) {
    return 'Сканируйте коробку повторно';
  }


  if (
    mode === 'pack'
  ) {
    return 'Запакуйте коробку';
  }


  return 'Сканирование не требуется';
}


function focusTsd() {

  if (
    scanSource !== 'tsd' ||
    !scannerNeedsInput()
  ) {
    return;
  }


  setTimeout(
    () => {

      try {
        tsdInput.focus({
          preventScroll: true
        });
      } catch (e) {
        tsdInput.focus();
      }

    },
    30
  );
}


function updateScanSurface() {

  const needsInput =
    scannerNeedsInput();


  btnModeTsd.classList.toggle(
    'active',
    scanSource === 'tsd'
  );

  btnModeCamera.classList.toggle(
    'active',
    scanSource === 'camera'
  );


  tsdHint.textContent =
    getScanPrompt();


  if (
    scanSource === 'tsd'
  ) {

    el('tsd-wrap').style.display =
      'block';

    el('reader-wrap').style.display =
      'none';


    tsdInput.disabled =
      !needsInput;


    if (needsInput) {
      focusTsd();
    }

  } else {

    el('tsd-wrap').style.display =
      'none';


    /*
      Во время упаковки камера вообще
      не показывается.
    */
    el('reader-wrap').style.display =
      needsInput
        ? 'block'
        : 'none';
  }
}


// =========================================================
// КАМЕРА
// =========================================================

async function startCamera() {

  if (
    scanSource !== 'camera' ||
    !scannerNeedsInput()
  ) {
    return;
  }


  if (
    cameraRunning ||
    cameraStarting
  ) {
    return;
  }


  cameraStarting = true;

  el('reader-wrap').style.display =
    'block';


  /*
    Ширина зоны рассчитывается так,
    чтобы qrbox гарантированно помещался
    даже на узких телефонах.
  */
  const qrWidth =
    Math.min(
      340,
      Math.max(
        220,
        window.innerWidth - 60
      )
    );


  const scannerConfig = {

    /*
      20 кадров достаточно быстро,
      но не создаёт чрезмерную нагрузку.
    */
    fps: 20,

    /*
      Для длинных одномерных штрихкодов
      нужна широкая и низкая область.
    */
    qrbox: {
      width: qrWidth,
      height: 90
    },

    disableFlip: true
  };


  try {

    /*
      Сначала используем самый совместимый
      способ выбора задней камеры.

      Именно такой вариант у тебя работал
      в старой версии.
    */
    await scanner.start(

      {
        facingMode: 'environment'
      },

      scannerConfig,

      onCameraScan
    );


    cameraRunning = true;


  } catch (firstError) {

    /*
      На некоторых телефонах facingMode
      работает плохо.

      Тогда получаем реальный список камер
      и явно выбираем заднюю.
    */
    try {

      await scanner
        .stop()
        .catch(() => {});


      const cameras =
        await Html5Qrcode.getCameras();


      if (
        !cameras ||
        !cameras.length
      ) {
        throw firstError;
      }


      /*
        Пытаемся найти камеру по названию.
      */
      let selectedCamera =
        cameras.find(camera =>
          /back|rear|environment|зад/i.test(
            camera.label || ''
          )
        );


      /*
        На телефонах задняя камера обычно
        последняя в списке.

        Это запасной вариант.
      */
      if (!selectedCamera) {
        selectedCamera =
          cameras[
            cameras.length - 1
          ];
      }


      await scanner.start(

        selectedCamera.id,

        scannerConfig,

        onCameraScan
      );


      cameraRunning = true;


    } catch (secondError) {

      cameraRunning = false;


      console.error(
        'Ошибка запуска камеры:',
        firstError,
        secondError
      );


      statusEl.innerHTML =
        '<span class="warn">' +
        'Не удалось открыть камеру' +
        '</span>' +

        '<br>' +

        '<small>' +
        'Проверьте разрешение на использование камеры' +
        '</small>';
    }
  }


  /*
    Если камера успешно открылась —
    отдельно настраиваем её возможности.

    Эти настройки НЕ участвуют в самом
    открытии камеры, поэтому телефон,
    который их не поддерживает,
    всё равно сможет сканировать.
  */
  if (cameraRunning) {

    try {

      const caps =
        scanner
          .getRunningTrackCapabilities();


      /*
        Убираем аппаратный зум.
      */
      if (
        caps &&
        caps.zoom &&
        typeof caps.zoom.min === 'number'
      ) {

        scanner
          .applyVideoConstraints({
            advanced: [
              {
                zoom: caps.zoom.min
              }
            ]
          })
          .catch(() => {});
      }


      /*
        Continuous autofocus применяем
        ОТДЕЛЬНО от zoom.

        Так ошибка одной настройки
        не ломает вторую.
      */
      if (
        caps &&
        Array.isArray(
          caps.focusMode
        ) &&
        caps.focusMode.includes(
          'continuous'
        )
      ) {

        scanner
          .applyVideoConstraints({
            advanced: [
              {
                focusMode: 'continuous'
              }
            ]
          })
          .catch(() => {});
      }

    } catch (e) {}
  }


  cameraStarting = false;
}


async function stopCamera() {

  /*
    Если камера ещё запускается,
    немного ждём завершения scanner.start().
  */
  if (cameraStarting) {

    for (
      let i = 0;
      i < 20 && cameraStarting;
      i++
    ) {

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            50
          )
      );
    }
  }


  try {

    await scanner.stop();

  } catch (e) {}


  cameraRunning = false;
  cameraStarting = false;
}


// =========================================================
// ПЕРЕКЛЮЧЕНИЕ ТСД / КАМЕРА
// =========================================================

async function setScanSource(source) {

  if (
    source !== 'tsd' &&
    source !== 'camera'
  ) {
    return;
  }


  scanSource = source;


  updateScanSurface();


  if (
    source === 'tsd'
  ) {

    await stopCamera();

    updateScanSurface();

    focusTsd();

    return;
  }


  /*
    Нажатие на кнопку одновременно
    разрешает WebAudio на мобильном.
  */
  getAudioContext();


  if (
    scannerNeedsInput()
  ) {
    await startCamera();
  }
}


btnModeTsd.onclick =
  () => {

    getAudioContext();

    setScanSource(
      'tsd'
    );
  };


btnModeCamera.onclick =
  () => {

    getAudioContext();

    setScanSource(
      'camera'
    );
  };


// =========================================================
// ТСД
// =========================================================

tsdInput.addEventListener(
  'keydown',
  event => {

    /*
      Большинство ТСД после кода отправляют Enter.
      Некоторые настроены на Tab — поддерживаем оба.
    */
    if (
      event.key !== 'Enter' &&
      event.key !== 'Tab'
    ) {
      return;
    }


    event.preventDefault();


    /*
      KeyDown считается действием пользователя,
      поэтому здесь можно разблокировать звук.
    */
    getAudioContext();


    const value =
      tsdInput.value;


    tsdInput.value = '';


    processScannedCode(
      value,
      'tsd'
    );


    focusTsd();
  }
);


// =========================================================
// РЕЗУЛЬТАТ КАМЕРЫ
// =========================================================

function onCameraScan(text) {

  const code =
    normalizeScan(text);


  if (!code) {
    return;
  }


  const now =
    Date.now();


  /*
    html5-qrcode может вернуть один и тот же
    штрихкод несколько раз подряд.

    Не считаем это несколькими сканами.
  */
  if (
    code === lastCameraCode &&
    now - lastCameraAt < 700
  ) {
    return;
  }


  lastCameraCode =
    code;

  lastCameraAt =
    now;


  processScannedCode(
    code,
    'camera'
  );
}


// =========================================================
// ЕДИНАЯ ЛОГИКА СКАНИРОВАНИЯ
//
// Здесь одинаково обрабатываются:
// - ТСД
// - камера
// =========================================================

function processScannedCode(
  rawCode,
  source
) {

  const code =
    normalizeScan(rawCode);


  if (!code) {
    return;
  }


  if (!db) {

    playError();

    statusEl.innerHTML =
      '<span class="warn">' +
      'Данные ещё не загружены' +
      '</span>';

    return;
  }


  // =====================================================
  // ЭТАП 1: КОРОБКА
  // =====================================================

  if (
    mode === 'box'
  ) {

    const box =
      db[code];


    /*
      Коробки нет в таблице.
    */
    if (!box) {

      currentCode =
        code;

      playError();

      render();

      statusEl.innerHTML =
        '<span class="warn">' +
        'Коробка «' +
        escapeHtml(code) +
        '» не найдена' +
        '</span>';


      if (
        source === 'camera'
      ) {
        stopCamera();
      }

      return;
    }


    currentCode =
      code;


    /*
      Уже закрытая коробка.
    */
    if (
      box.status === ST_DONE
    ) {

      playError();

      render();

      statusEl.innerHTML =
        '<span class="warn">' +
        'Коробка уже закрыта' +
        '</span>';


      if (
        source === 'camera'
      ) {
        stopCamera();
      }

      return;
    }


    /*
      Если коробка уже "В процессе",
      считаем, что товар для неё
      ранее уже был проверен.

      Сразу возвращаемся к упаковке.
    */
    if (
      box.status === ST_WORK
    ) {

      playSuccess();

      mode =
        'pack';

      render();


      if (
        source === 'camera'
      ) {
        stopCamera();
      }

      return;
    }


    /*
      Новая коробка:
      переходим к сканированию товара.
    */
    playSuccess();


    mode =
      'product';


    /*
      Для камеры запоминаем недавно
      считанную коробку.

      Если она ещё секунду остаётся
      перед камерой, не будем ошибочно
      считать её "неправильным товаром".
    */
    if (
      source === 'camera'
    ) {

      lastBoxCameraCode =
        code;

      lastBoxCameraAt =
        Date.now();
    }


    render();

    return;
  }


  // =====================================================
  // ЭТАП 2: ТОВАР
  // =====================================================

  if (
    mode === 'product'
  ) {

    const box =
      db[currentCode];


    if (!box) {

      playError();

      statusEl.innerHTML =
        '<span class="warn">' +
        'Ошибка: коробка не найдена' +
        '</span>';

      return;
    }


    const expectedBarcode =
      normalizeScan(
        box.productBarcode
      );


    /*
      После скана коробки камера может
      ещё видеть эту же этикетку.

      Первые 2 секунды просто игнорируем
      повторный код коробки.
    */
    if (
      source === 'camera' &&
      code === lastBoxCameraCode &&
      code !== expectedBarcode &&
      Date.now() -
        lastBoxCameraAt <
        2000
    ) {
      return;
    }


    /*
      В таблице не указан штрихкод товара.
    */
    if (!expectedBarcode) {

      playError();

      statusEl.innerHTML =
        '<span class="warn">' +
        'У этой коробки не указан штрихкод товара в колонке F' +
        '</span>';

      return;
    }


    /*
      НЕПРАВИЛЬНЫЙ ТОВАР.
    */
    if (
      code !== expectedBarcode
    ) {

      playError();

      statusEl.innerHTML =
        '<span class="warn">' +
        'НЕПРАВИЛЬНЫЙ ТОВАР' +
        '</span>' +

        '<br>' +

        'Отсканирован: ' +
        escapeHtml(code);


      /*
        Камеру не выключаем:
        можно сразу показать правильный товар.
      */

      focusTsd();

      return;
    }


    /*
      ПРАВИЛЬНЫЙ ТОВАР.
    */
    playSuccess();


    /*
      Сразу, без ожидания сервера,
      ставим "В процессе".
    */
    setStatusSilent(
      'start',
      ST_WORK
    );


    /*
      Кнопка "Начать запаковку"
      больше не нужна.

      Мы автоматически перешли
      к упаковке.
    */
    mode =
      'pack';


    render();


    /*
      Пока пользователь физически
      запаковывает коробку,
      камера не нужна.
    */
    if (
      source === 'camera'
    ) {
      stopCamera();
    }


    return;
  }


  // =====================================================
  // ЭТАП 3: ПОВТОРНАЯ КОРОБКА
  // =====================================================

  if (
    mode === 'confirm'
  ) {

    /*
      Сканируется другая коробка.
    */
    if (
      code !==
      normalizeScan(currentCode)
    ) {

      playError();

      statusEl.innerHTML =
        '<span class="warn">' +
        'ШТРИХКОДЫ НЕ СОВПАДАЮТ' +
        '</span>' +

        '<br>' +

        'Нужна коробка «' +
        escapeHtml(currentCode) +
        '»';

      return;
    }


    /*
      Всё правильно.
    */
    playSuccess();


    setStatusSilent(
      'close',
      ST_DONE
    );


    mode =
      'box';


    render();


    if (
      source === 'camera'
    ) {
      stopCamera();
    }


    return;
  }
}


// =========================================================
// СВОРАЧИВАНИЕ / ВОЗВРАТ
// =========================================================

document.addEventListener(
  'visibilitychange',
  async () => {

    /*
      При сворачивании камера всегда
      полностью выключается.
    */
    if (
      document.visibilityState !==
      'visible'
    ) {

      await stopCamera();

      return;
    }


    /*
      При возвращении камера запускается
      только если пользователь сам выбрал
      режим "Камера" и сейчас действительно
      нужен скан.
    */
    if (
      scanSource === 'camera' &&
      scannerNeedsInput()
    ) {

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            250
          )
      );

      await startCamera();

      return;
    }


    focusTsd();
  }
);


// =========================================================
// ПЕРВОНАЧАЛЬНЫЙ РЕЖИМ
// =========================================================

updateScanSurface();

focusTsd();


// =========================================================
// СТАТИСТИКА ПОСТАВКИ
// =========================================================

  
    function supplyStats(supply) {

      let total = 0;
      let done = 0;
      let work = 0;

      for (const code in db) {

        const box = db[code];

        if (box.supply !== supply) {
          continue;
        }

        total++;

        if (box.status === ST_DONE) {
          done++;
        }

        if (box.status === ST_WORK) {
          work++;
        }
      }

      /*
        В общий счётчик включаем:

        Закрыта
        +
        В процессе
      */
      const counted =
        done + work;

      return {
        total,
        done,
        work,
        counted
      };
    }


    function getCounterClass(stats) {

      /*
        Есть хотя бы одна "В процессе" —
        счётчик жёлтый.
      */
      if (stats.work > 0) {
        return 'counter-yellow';
      }

      /*
        Всё полностью закрыто —
        зелёный.
      */
      if (
        stats.total > 0 &&
        stats.done === stats.total
      ) {
        return 'counter-green';
      }

      return 'counter-blue';
    }


    // =========================================================
    // КАРТОЧКА КОРОБКИ
    // =========================================================

    function render() {

  hideButtons();


  const box =
    db &&
    currentCode
      ? db[currentCode]
      : null;


  cardEl.style.display =
    currentCode
      ? 'block'
      : 'none';


  /*
    Неизвестная коробка.
  */
  if (
    currentCode &&
    !box
  ) {

    cardEl.innerHTML =
      '<span class="warn">' +
      'Код «' +
      escapeHtml(currentCode) +
      '» не найден в таблице' +
      '</span>';


    el('btnAgain').style.display =
      'block';

    el('btnSupplies').style.display =
      'block';


    updateScanSurface();

    return;
  }


  if (!box) {

    updateScanSurface();

    return;
  }


  const badgeClass =
    box.status === ST_DONE
      ? 'st-done'
      : box.status === ST_WORK
        ? 'st-work'
        : 'st-new';


  const stats =
    supplyStats(
      box.supply
    );


  const counterClass =
    getCounterClass(
      stats
    );


  let html =

    '<div class="badge-row">' +

      '<span class="badge ' +
      badgeClass +
      '">' +

        escapeHtml(
          box.status
        ) +

      '</span>' +

      '<span class="counter ' +
      counterClass +
      '" onclick="toggleSupply()">' +

        'Закрыто ' +
        stats.counted +
        '/' +
        stats.total +

      '</span>' +

    '</div>' +


    '<table>' +


      /*
        Номер коробки первым,
        над кластером.
      */
      '<tr>' +

        '<td>Коробка</td>' +

        '<td><b>' +
          escapeHtml(
            currentCode
          ) +
        '</b></td>' +

      '</tr>';


  for (
    const k in box.info
  ) {

    html +=

      '<tr>' +

        '<td>' +
          escapeHtml(k) +
        '</td>' +

        '<td>' +
          escapeHtml(
            box.info[k]
          ) +
        '</td>' +

      '</tr>';
  }


  html +=
    '</table>' +

    '<div ' +
      'id="supplyList" ' +
      'style="display:none">' +
    '</div>';


  cardEl.innerHTML =
    html;


  // =====================================================
  // ЗАКРЫТА
  // =====================================================

  if (
    box.status === ST_DONE
  ) {

    statusEl.textContent =
      'Коробка уже закрыта';


    el('btnAgain').style.display =
      'block';

    el('btnSupplies').style.display =
      'block';


    updateScanSurface();

    return;
  }


  // =====================================================
  // ЖДЁМ ТОВАР
  // =====================================================

  if (
    mode === 'product'
  ) {

    statusEl.innerHTML =
      '<span class="hint">' +
      'Коробка найдена. Теперь отсканируйте товар' +
      '</span>';


    el('btnAgain').style.display =
      'block';

    el('btnSupplies').style.display =
      'block';


    updateScanSurface();

    return;
  }


  // =====================================================
  // УПАКОВКА
  // =====================================================

  if (
    mode === 'pack'
  ) {

    statusEl.innerHTML =
      '<span class="hint">' +
      'Товар верный. Запакуйте коробку и наклейте стикер' +
      '</span>';


    el('btnClose').style.display =
      'block';

    el('btnAgain').style.display =
      'block';

    el('btnSupplies').style.display =
      'block';


    updateScanSurface();

    return;
  }


  // =====================================================
  // ПОДТВЕРЖДЕНИЕ ЗАКРЫТИЯ
  // =====================================================

  if (
    mode === 'confirm'
  ) {

    statusEl.innerHTML =
      '<span class="hint">' +
      'Отсканируйте коробку «' +
      escapeHtml(currentCode) +
      '» ещё раз' +
      '</span>';


    el('btnCancel').style.display =
      'block';


    updateScanSurface();

    return;
  }


  updateScanSurface();
}


    // =========================================================
    // СКРЫТИЕ КНОПОК
    // =========================================================

    function hideButtons() {

  [
    'btnClose',
    'btnCancel',
    'btnAgain',
    'btnSupplies'
  ].forEach(id => {

    el(id).style.display =
      'none';
  });


  el('allSupplies').style.display =
    'none';
}


    // =========================================================
    // КОРОБКИ ОДНОЙ ПОСТАВКИ
    // =========================================================

    function supplyBoxesHtml(supply) {

  let html = '<table class="box-list-table">';

      /*
        Сортируем коробки внутри поставки
        по коду.
      */
      const codes =
        Object.keys(db)
          .filter(code =>
            db[code].supply === supply
          )
          .sort((a, b) =>
            a.localeCompare(
              b,
              'ru',
              {
                numeric: true,
                sensitivity: 'base'
              }
            )
          );


      for (const code of codes) {

        const b = db[code];

        const badgeClass =
          b.status === ST_DONE
            ? 'st-done'
            : b.status === ST_WORK
              ? 'st-work'
              : 'st-new';


        html +=
  '<tr class="box-main-row">' +

    '<td>' +

      '<span class="box-code" data-code="' +
      escapeHtml(code) +
      '">' +
        escapeHtml(code) +
      '</span>' +

      '<br>' +

      '<small style="color:#666">' +

        escapeHtml(
          b.article || '—'
        ) +

        ' — ' +

        escapeHtml(
          b.qty || '?'
        ) +

        ' шт.' +

      '</small>' +

    '</td>' +

    '<td style="text-align:center">' +

      '<span class="badge ' +
      badgeClass +
      '">' +

        escapeHtml(b.status) +

      '</span>' +

    '</td>' +

  '</tr>' +

  /*
    Отдельная строка на всю ширину таблицы.
  */
  '<tr class="barcode-row" data-barcode="' +
  escapeHtml(code) +
  '">' +

    '<td colspan="2">' +

      '<div class="box-barcode">' +
        '<svg></svg>' +
      '</div>' +

    '</td>' +

  '</tr>';
      }


      return html + '</table>';
    }

    // =========================================================
// ШТРИХКОД КОРОБКИ В СПИСКЕ
// =========================================================

document.addEventListener(
  'click',
  event => {

    const codeEl =
      event.target.closest('.box-code');

    if (!codeEl) {
      return;
    }


    const mainRow =
      codeEl.closest('tr');

    if (!mainRow) {
      return;
    }


    /*
      Строка со штрихкодом находится
      сразу под строкой коробки.
    */
    const barcodeRow =
      mainRow.nextElementSibling;

    if (
      !barcodeRow ||
      !barcodeRow.classList.contains(
        'barcode-row'
      )
    ) {
      return;
    }


    /*
      Повторное нажатие —
      закрываем штрихкод.
    */
    if (
      barcodeRow.classList.contains('open')
    ) {
      barcodeRow.classList.remove('open');
      return;
    }


    /*
      Закрываем ранее открытый штрихкод.
    */
    document
      .querySelectorAll('.barcode-row.open')
      .forEach(row => {
        row.classList.remove('open');
      });


    barcodeRow.classList.add('open');


    /*
      Если уже рисовали его раньше,
      второй раз не генерируем.
    */
    if (
      barcodeRow.dataset.rendered === '1'
    ) {
      return;
    }


    const svg =
      barcodeRow.querySelector('svg');

    const code =
      barcodeRow.dataset.barcode;


    try {

      JsBarcode(
        svg,
        code,
        {
          format: 'CODE128',

          /*
            Целое значение вместо 1.7:
            линии получаются намного чётче.
          */
          width: 2,

          /*
            Более высокий штрихкод
            легче считывается камерой.
          */
          height: 90,

          /*
            Чистый чёрный на белом.
          */
          lineColor: '#000000',
          background: '#ffffff',

          displayValue: false,
          margin: 0
        }
      );


      /*
        Растягиваем SVG на всю доступную ширину.
        shape-rendering выше не даёт линиям
        становиться серыми при масштабировании.
      */
      svg.style.width = '100%';
      svg.style.maxWidth = 'none';


      barcodeRow.dataset.rendered =
        '1';

    } catch (e) {

      barcodeRow
        .querySelector('.box-barcode')
        .innerHTML =
          '<span class="warn">' +
          'Не удалось создать штрихкод' +
          '</span>';
    }
  }
);

    
    // =========================================================
    // РАСКРЫТИЕ ПОСТАВКИ
    // =========================================================

    function toggleSupply() {

      const listEl =
        el('supplyList');


      if (
        listEl.style.display ===
        'block'
      ) {

        listEl.style.display =
          'none';

        return;
      }


      const supply =
        db[currentCode].supply;


      listEl.innerHTML =
        '<b>' +
        'Коробки поставки «' +
        escapeHtml(supply) +
        '»' +
        '</b>' +

        supplyBoxesHtml(supply);


      listEl.style.display =
        'block';
    }


    // =========================================================
    // ИЗМЕНЕНИЕ СТАТУСА
    //
    // ГЛАВНОЕ ИЗМЕНЕНИЕ:
    //
    // пользователь НЕ ждёт ответа сервера.
    //
    // 1. Меняем статус локально
    // 2. Сразу перерисовываем интерфейс
    // 3. Записываем действие в очередь
    // 4. Отправляем очередь в фоне
    //
    // =========================================================

    // =========================================================
// ТИХАЯ СМЕНА СТАТУСА
// =========================================================

function setStatusSilent(
  action,
  newStatus
) {

  const code =
    currentCode;


  if (
    !db ||
    !db[code]
  ) {
    return;
  }


  /*
    Интерфейс меняется мгновенно.
  */
  db[code].status =
    newStatus;


  saveDbCache();


  /*
    Серверная запись попадает
    в локальную очередь.
  */
  addToQueue(
    action,
    code,
    newStatus
  );


  /*
    Отправляем в фоне.
    Пользователь этого не ждёт.
  */
  processQueue();
}


// =========================================================
// ЗАКРЫТЬ КОРОБКУ
// =========================================================

el('btnClose').onclick =
  async () => {

    mode =
      'confirm';


    /*
      Разрешаем звук после
      пользовательского нажатия.
    */
    getAudioContext();


    render();


    if (
      scanSource === 'camera'
    ) {

      await startCamera();

    } else {

      focusTsd();
    }
  };


// =========================================================
// ОТМЕНА ПОВТОРНОГО СКАНА
// =========================================================

el('btnCancel').onclick =
  async () => {

    mode =
      'pack';


    await stopCamera();


    render();
  };


// =========================================================
// СКАНИРОВАТЬ ДРУГУЮ КОРОБКУ
// =========================================================

el('btnAgain').onclick =
  async () => {

    await stopCamera();


    mode =
      'box';

    currentCode =
      null;


    cardEl.style.display =
      'none';


    hideButtons();


    statusEl.textContent =
      'Отсканируйте штрих-код коробки';


    el('btnSupplies').style.display =
      'block';


    updateScanSurface();


    if (
      scanSource === 'camera'
    ) {

      await startCamera();

    } else {

      focusTsd();
    }
  };


// =========================================================
// ВСЕ ПОСТАВКИ
// =========================================================


    // =========================================================
    // ВСЕ ПОСТАВКИ
    // =========================================================

    el('btnSupplies').onclick = () => {

      const panel =
        el('allSupplies');


      if (
        panel.style.display ===
        'block'
      ) {

        panel.style.display =
          'none';

        return;
      }


      if (!db) return;


      const stats = {};


      for (const code in db) {

        const b = db[code];

        const supplyName =
          b.supply || 'Без поставки';


        const st =
          stats[supplyName] =
          stats[supplyName] || {
            total: 0,
            done: 0,
            work: 0,
            clusters: []
          };


        st.total++;


        if (
          b.status === ST_DONE
        ) {
          st.done++;
        }


        if (
          b.status === ST_WORK
        ) {
          st.work++;
        }


        if (
          b.cluster &&
          !st.clusters.includes(
            b.cluster
          )
        ) {

          st.clusters.push(
            b.cluster
          );
        }
      }


      let html =
        '<b>Все поставки</b>';


      /*
        СОРТИРОВКА ПО АЛФАВИТУ
      */
      /*
  Сначала сами названия кластеров
  сортируем А → Я.
*/
for (const supplyName in stats) {
  stats[supplyName].clusters.sort(
    (a, b) =>
      a.localeCompare(
        b,
        'ru',
        {
          numeric: true,
          sensitivity: 'base'
        }
      )
  );
}


/*
  Все поставки сортируем уже
  НЕ по названию поставки,
  а по названию кластера А → Я.

  Если у поставки несколько кластеров,
  для сортировки берётся первый
  по алфавиту.

  Поставки без кластера идут в конце.
*/
const supplyNames =
  Object.keys(stats)
    .sort((a, b) => {

      const clusterA =
        stats[a].clusters[0] || '';

      const clusterB =
        stats[b].clusters[0] || '';


      if (!clusterA && clusterB) {
        return 1;
      }

      if (clusterA && !clusterB) {
        return -1;
      }


      const clusterCompare =
        clusterA.localeCompare(
          clusterB,
          'ru',
          {
            numeric: true,
            sensitivity: 'base'
          }
        );


      /*
        Если кластер одинаковый —
        внутри него поставки сортируем
        по названию.
      */
      if (clusterCompare !== 0) {
        return clusterCompare;
      }


      return a.localeCompare(
        b,
        'ru',
        {
          numeric: true,
          sensitivity: 'base'
        }
      );
    });


      for (
        const supplyName
        of supplyNames
      ) {

        const st =
          stats[supplyName];


        /*
          В счётчик включаем:
          Закрыта + В процессе
        */
        const counted =
          st.done + st.work;


        let statusClass;


        /*
          Есть "В процессе" —
          жёлтый счётчик.
        */
        if (st.work > 0) {

          statusClass =
            'sup-yellow';


        /*
          Все полностью закрыты —
          зелёный.
        */
        } else if (
          st.done === st.total
        ) {

          statusClass =
            'sup-green';


        /*
          Иначе красный.
        */
        } else {

          statusClass =
            'sup-red';
        }


        html +=
          '<div ' +
          'class="sup-row" ' +
          'data-supply="' +
          escapeHtml(supplyName) +
          '">' +

            '«' +
            escapeHtml(supplyName) +
            '» — ' +

            '<span class="' +
            statusClass +
            '">' +

              'Закрыто ' +
              counted +
              '/' +
              st.total +

            '</span>' +


            (
              st.clusters.length
                ?
                  '<br>' +
                  '<small style="color:#666">' +
                  escapeHtml(
                    st.clusters.join(', ')
                  ) +
                  '</small>'
                :
                  ''
            ) +

          '</div>' +

          '<div ' +
          'class="sup-detail" ' +
          'style="display:none">' +
          '</div>';
      }


      panel.innerHTML = html;


      panel
        .querySelectorAll(
          '.sup-row'
        )
        .forEach(row => {

          row.onclick = () => {

            const det =
              row.nextElementSibling;


            if (
              det.style.display ===
              'block'
            ) {

              det.style.display =
                'none';

              return;
            }


            det.innerHTML =
              supplyBoxesHtml(
                row.dataset.supply
              );


            det.style.display =
              'block';
          };
        });


      panel.style.display =
        'block';
    };


    // =========================================================
    // СОБЫТИЯ СЕТИ
    // =========================================================

    window.addEventListener(
      'offline',
      () => {

        updateNetState();

        if (!currentCode) {
          statusEl.textContent =
            'Офлайн-режим. Изменения будут сохранены и отправлены позже';
        }
      }
    );


    window.addEventListener(
      'online',
      async () => {

        updateNetState();

        /*
          Сначала отправляем все
          накопившиеся действия.
        */
        await processQueue();


        /*
          Потом тихо пытаемся получить
          свежую таблицу.
        */
        try {

          const res =
            await api('all=1');


          db =
            applyPendingStatuses(
              res.all || {}
            );


          saveDbCache();


          if (
            currentCode &&
            db[currentCode]
          ) {
            render();
          }

        } catch (e) {}


        updateNetState();
      }
    );


    updateNetState();


    // =========================================================
    // PWA / SERVICE WORKER
    // =========================================================

    if (
      'serviceWorker' in navigator
    ) {

      window.addEventListener(
        'load',
        () => {

          navigator
            .serviceWorker
            .register('./sw.js')
            .catch(() => {});
        }
      );
    }

  </script>
